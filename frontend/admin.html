<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Close Finance</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #061c2b;
      --dark: #09283a;
      --green: #0569AD;
      --cream: #f5f3ec;
      --white: #ffffff;
      --text: #18303d;
      --muted: #64747d;
      --border: #dce2df;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Inter", sans-serif; color: var(--text); background: var(--cream); line-height: 1.6; }
    .container { width: min(1200px, calc(100% - 48px)); margin: auto; padding: 40px 0; }

    header { background: var(--navy); color: white; padding: 20px 0; margin-bottom: 40px; }
    .header-inner { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: 800; font-size: 24px; }
    .logout-btn { color: white; text-decoration: none; font-weight: 600; font-size: 14px; cursor: pointer; }

    .admin-card { background: white; padding: 30px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; }
    .admin-card h2 { color: var(--navy); margin-bottom: 20px; font-size: 22px; }

    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { text-align: left; padding: 15px; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { background: #f8faf9; font-weight: 700; color: var(--navy); }
    
    .status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .status-processing { background: #fff4e6; color: #d97706; }
    .status-accepted { background: #e6fffa; color: #0891b2; }
    .status-final { background: #ebf8ff; color: #3182ce; }
    .status-completed { background: #f0fff4; color: #38a169; }

    select { padding: 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; outline: none; }
    
    #loginSection { max-width: 400px; margin: 100px auto; }
    #dashboardSection { display: none; }
    
    .btn { padding: 12px 20px; background: var(--green); color: white; border: none; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; }
    .btn:hover { background: #045a96; }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid var(--border); }

    .error-msg { color: #e74c3c; font-size: 13px; margin-bottom: 15px; display: none; }
  </style>
</head>
<body>

  <!-- LOGIN SECTION -->
  <div id="loginSection" class="admin-card">
    <h2>Admin Login</h2>
    <div id="loginError" class="error-msg"></div>
    <form id="adminLoginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="adminEmail" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="adminPassword" required>
      </div>
      <button type="submit" class="btn">Login to Dashboard</button>
    </form>
  </div>

  <!-- DASHBOARD SECTION -->
  <div id="dashboardSection">
    <header>
      <div class="container header-inner">
        <div class="logo">Close Finance Admin</div>
        <a class="logout-btn" onclick="logout()">Logout</a>
      </div>
    </header>

    <div class="container">
      <div class="admin-card">
        <h2>Loan Applications</h2>
        <div id="tableContainer">
          <p>Loading applications...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="api-config.js"></script>
  <script>
    const loginSection = document.getElementById('loginSection');
    const dashboardSection = document.getElementById('dashboardSection');
    const loginForm = document.getElementById('adminLoginForm');
    const loginError = document.getElementById('loginError');

    // Check if already logged in
    if (localStorage.getItem('adminToken')) {
      showDashboard();
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value;
      const password = document.getElementById('adminPassword').value;

      try {
        const res = await fetch(`${API_URL}/api/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('adminToken', data.token);
          showDashboard();
        } else {
          loginError.textContent = data.error || 'Login failed';
          loginError.style.display = 'block';
        }
      } catch (err) {
        loginError.textContent = 'Server error';
        loginError.style.display = 'block';
      }
    });

    function showDashboard() {
      loginSection.style.display = 'none';
      dashboardSection.style.display = 'block';
      fetchApplications();
    }

    async function fetchApplications() {
      const token = localStorage.getItem('adminToken');
      try {
        const res = await fetch(`${API_URL}/api/admin/applications`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const apps = await res.json();
        renderTable(apps);
      } catch (err) {
        document.getElementById('tableContainer').innerHTML = '<p>Error loading applications.</p>';
      }
    }

    function renderTable(apps) {
      if (!apps.length) {
        document.getElementById('tableContainer').innerHTML = '<p>No applications found.</p>';
        return;
      }

      let html = `<table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Update Status</th>
          </tr>
        </thead>
        <tbody>`;

      apps.forEach(app => {
        const statusClass = `status-${app.status.toLowerCase().replace(' ', '-')}`;
        const amount = app.loanType === 'business' ? app.loanAmount : app.loanAmountPersonal;
        
        html += `<tr>
          <td>${app.fullName}<br><small>${app.email}</small></td>
          <td>${app.loanType.toUpperCase()}</td>
          <td>${amount}</td>
          <td><span class="status-badge ${statusClass}">${app.status}</span></td>
          <td>
            <select onchange="updateStatus(${app.id}, this.value)">
              <option value="Processing" ${app.status === 'Processing' ? 'selected' : ''}>Processing</option>
              <option value="Accepted" ${app.status === 'Accepted' ? 'selected' : ''}>Accepted</option>
              <option value="Final Steps" ${app.status === 'Final Steps' ? 'selected' : ''}>Final Steps</option>
              <option value="Completed" ${app.status === 'Completed' ? 'selected' : ''}>Completed</option>
            </select>
          </td>
        </tr>`;
      });

      html += '</tbody></table>';
      document.getElementById('tableContainer').innerHTML = html;
    }

    async function updateStatus(id, newStatus) {
      const token = localStorage.getItem('adminToken');
      try {
        const res = await fetch(`${API_URL}/api/admin/applications/${id}/status`, {
          method: 'PUT',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ status: newStatus })
        });
        const data = await res.json();
        if (data.success) {
          fetchApplications(); // Refresh table
        } else {
          alert('Failed to update status');
        }
      } catch (err) {
        alert('Server error');
      }
    }

    function logout() {
      localStorage.removeItem('adminToken');
      window.location.reload();
    }
  </script>
</body>
</html>
